; Xdebug 3 settings for the devel image (Ubuntu's php-xdebug already loads
; the extension via mods-available/xdebug.ini; this file only configures it).
; Debugging and profiling start on request only: set the XDEBUG_SESSION
; cookie/parameter to debug, XDEBUG_PROFILE to profile. IDE port: 9003.
[xdebug]
xdebug.mode=debug,profile
xdebug.start_with_request=trigger
xdebug.discover_client_host=1
xdebug.output_dir=/var/log/apache2
