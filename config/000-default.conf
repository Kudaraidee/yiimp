# Public web: Yii2 app
<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/yiimp2/web/

	<Directory "/var/yiimp2/web/">
		Options -Indexes
		Require all granted
		AllowOverride all
	</Directory>	

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
