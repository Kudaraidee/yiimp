<VirtualHost *:80>
	ServerName your-pool.example.com
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/

	<Directory "/var/www/">
		Options -Indexes
		Require all granted
		AllowOverride all
	</Directory>	

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

<VirtualHost *:443>
    ServerName your-pool.example.com
    ServerAdmin admin@your-pool.example.com

    DocumentRoot /var/www/

    <Directory "/var/www/">
        Options -Indexes
        Require all granted
        AllowOverride All
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/your-pool.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-pool.example.com/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
