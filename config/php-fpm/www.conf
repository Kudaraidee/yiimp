; PHP-FPM pool configuration for yiimp2
; This configuration optimizes PHP-FPM for the mining pool application

[www]

; Unix user/group of processes
user = www-data
group = www-data

; The address on which to accept FastCGI requests
; Using Unix socket for better performance
listen = /run/php/php8.3-fpm.sock

; Set permissions for unix socket
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Choose how the process manager will control the number of child processes
; Options: static, dynamic, ondemand
; dynamic = dynamically adjust based on load (recommended for production)
pm = dynamic

; The maximum number of child processes to be created
; This should be tuned based on available RAM
; Rule of thumb: (Total RAM - RAM for other services) / 50MB per PHP process
pm.max_children = 50

; The number of child processes created on startup
pm.start_servers = 5

; The desired minimum number of idle server processes
pm.min_spare_servers = 5

; The desired maximum number of idle server processes
pm.max_spare_servers = 35

; The number of requests each child process should execute before respawning
; Useful to work around memory leaks in 3rd party libraries
pm.max_requests = 500

; The timeout for serving a single request
; Should match or exceed nginx fastcgi_read_timeout
request_terminate_timeout = 300s

; The timeout for serving of single request after which a PHP backtrace will be dumped to the 'slowlog' file
request_slowlog_timeout = 30s

; The log file for slow requests
slowlog = /var/log/yiimp2/php-fpm-slow.log

; Set open file descriptor rlimit
rlimit_files = 65536

; Set max core size rlimit
rlimit_core = 0

; Chdir to this directory at the start
chdir = /var/yiimp2

; Redirect worker stdout and stderr into main error log
catch_workers_output = yes

; Clear environment in FPM workers
; Prevents arbitrary environment variables from reaching FPM worker processes
clear_env = no

; Pass environment variables to PHP-FPM
; These are required for the Yii2 application to connect to services

; Database configuration
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD] = $DB_PASSWORD
env[DB_PORT] = $DB_PORT

; Memcached configuration
env[MEMCACHED_HOST] = $MEMCACHED_HOST
env[MEMCACHED_PORT] = $MEMCACHED_PORT

; Application configuration
env[YIIMP_DEBUG] = $YIIMP_DEBUG
env[YII_ENV] = $YII_ENV
env[YII_DEBUG] = $YII_DEBUG

; Security keys
env[COOKIE_VALIDATION_KEY] = $COOKIE_VALIDATION_KEY
env[CSRF_COOKIE_NAME] = $CSRF_COOKIE_NAME

; Path configuration
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP configuration overrides
; These can also be set in php.ini, but setting here allows per-pool customization

; Maximum execution time of each script, in seconds
php_admin_value[max_execution_time] = 300

; Maximum amount of time each script may spend parsing request data
php_admin_value[max_input_time] = 300

; Maximum amount of memory a script may consume
php_admin_value[memory_limit] = 256M

; Maximum size of POST data that PHP will accept
php_admin_value[post_max_size] = 50M

; Maximum allowed size for uploaded files
php_admin_value[upload_max_filesize] = 50M

; Error reporting level
; In production: E_ALL & ~E_DEPRECATED & ~E_STRICT
; In development: E_ALL
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Display errors (should be Off in production)
php_admin_flag[display_errors] = off

; Log errors to file
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/yiimp2/php-fpm-error.log

; Session configuration
php_value[session.save_handler] = memcached
php_value[session.save_path] = "${MEMCACHED_HOST}:${MEMCACHED_PORT}"
php_value[session.gc_maxlifetime] = 3600
php_value[session.cookie_httponly] = 1
php_value[session.cookie_secure] = 0
php_value[session.use_strict_mode] = 1

; OPcache configuration for better performance
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.fast_shutdown] = 1

; Timezone
php_admin_value[date.timezone] = UTC

; Disable dangerous functions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
