# Nginx configuration for yiimp2 (Development)
# This configuration includes debug features and relaxed security for development

# Generate CSP nonce using Nginx request_id
map $request_id $csp_nonce {
    default $request_id;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    # Document root for Yii2 application
    root /var/yiimp2/web;
    index index.php index.html;
    
    # Charset
    charset utf-8;
    
    # Verbose logging for development
    access_log /var/log/nginx/yiimp2-access.log;
    error_log /var/log/nginx/yiimp2-error.log debug;
    
    # Client body size limit (for file uploads)
    client_max_body_size 50M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CSP header with nonce - includes unsafe-eval for Yii2 debug toolbar
    # Inline styles removed - all styling via external stylesheets
    # Using specific -elem directives to control external resources separately from inline
    # Added hashes for third-party library inline scripts/styles (jQuery DOMEval, Bootstrap, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce' 'unsafe-eval'; script-src-elem 'self' 'nonce-$csp_nonce' 'unsafe-eval' 'sha256-YzwpIdlhXTB126pb2q/vihpB+Wi0ZbB0pgkXIAOO3sk='; style-src 'self'; style-src-elem 'self' 'sha256-ZLc2RUEZH+bnvaKNlogYgd6pOSr1LEEh2vOp3NT/ECU=' 'sha256-VyHeNfMcVpEmF2DHZeJfhCiBXVr6MCvSeDVLrAcpKss=' 'sha256-3IL6vpnscstlAHatOzMR+Hq4pUBi+owMf+qTaCsqJy0=' 'sha256-nXkKgqMUAapKqqr3cCb8bqrUFHmVjTTyWYNR8oUYotM=' 'sha256-RKYPG5glQExronBKI00/aWbs6PBfo8SHa7WLaPva5Tw='; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    
    # Disable caching in development
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # Static files - no caching in dev
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        
        # Try to serve file directly, fallback to index.php
        try_files $uri =404;
    }
    
    # Deny access to dotfiles (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive paths (but allow in dev for debugging)
    location ~ ^/(runtime|vendor)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Allow access to tests in development
    location ~ ^/tests/ {
        # Allow in dev mode
    }
    
    # Deny access to sensitive files
    location ~ \.(env|gitignore|gitmodules|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # PHP-FPM processing
    location ~ \.php$ {
        # Security: Don't allow PHP execution in uploads
        location ~ ^/uploads/.*\.php$ {
            deny all;
        }
        
        try_files $uri =404;
        
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Pass CSP nonce to PHP application
        fastcgi_param HTTP_X_CSP_NONCE $csp_nonce;
        
        # Extended timeouts for debugging
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        
        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Pass environment variables
        fastcgi_param DB_HOST $http_x_db_host;
        fastcgi_param DB_NAME $http_x_db_name;
        fastcgi_param DB_USER $http_x_db_user;
        fastcgi_param DB_PASSWORD $http_x_db_password;
        fastcgi_param YIIMP_DEBUG "true";
        
        # Enable Xdebug profiling headers
        fastcgi_param XDEBUG_CONFIG "idekey=PHPSTORM";
    }
    
    # Yii2 URL rewriting - try files first, then route to index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Specific handling for API endpoints
    location /api/ {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Specific handling for admin panel
    location /admin/ {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Allow Yii2 debug and gii in development
    location ~ ^/(debug|gii) {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy (dev mode)\n";
        add_header Content-Type text/plain;
    }
    
    # Development diagnostic endpoint
    location /phpinfo {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /phpinfo;
        include fastcgi_params;
    }
}
