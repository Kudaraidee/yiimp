# Nginx configuration for yiimp2 (Production)
# This configuration serves the Yii2-based mining pool frontend

# Generate CSP nonce using Nginx variables
# Note: This requires compiling Nginx with --with-http_secure_link_module or using njs
# For simplicity, we'll use a Perl-based approach that works with standard Nginx + perl module

# Map to generate a random nonce for each request
map $request_id $csp_nonce {
    default $request_id;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    # Document root for Yii2 application
    root /var/yiimp2/web;
    index index.php index.html;
    
    # Charset
    charset utf-8;
    
    # Logging
    access_log /var/log/nginx/yiimp2-access.log;
    error_log /var/log/nginx/yiimp2-error.log warn;
    
    # Client body size limit (for file uploads)
    client_max_body_size 10M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CSP header with nonce (generated per request)
    # Note: The application will read the nonce from HTTP_X_CSP_NONCE and add it to inline scripts
    # Inline styles removed - all styling via external stylesheets
    # Using specific -elem directives to control external resources separately from inline
    # Production: No 'unsafe-eval' - stricter security
    # Added hashes for third-party library inline scripts/styles (jQuery DOMEval, Bootstrap, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; script-src-elem 'self' 'nonce-$csp_nonce' 'sha256-YzwpIdlhXTB126pb2q/vihpB+Wi0ZbB0pgkXIAOO3sk='; style-src 'self'; style-src-elem 'self' 'sha256-ZLc2RUEZH+bnvaKNlogYgd6pOSr1LEEh2vOp3NT/ECU=' 'sha256-VyHeNfMcVpEmF2DHZeJfhCiBXVr6MCvSeDVLrAcpKss=' 'sha256-3IL6vpnscstlAHatOzMR+Hq4pUBi+owMf+qTaCsqJy0=' 'sha256-nXkKgqMUAapKqqr3cCb8bqrUFHmVjTTyWYNR8oUYotM=' 'sha256-RKYPG5glQExronBKI00/aWbs6PBfo8SHa7WLaPva5Tw='; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    
    # Static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Try to serve file directly, fallback to index.php
        try_files $uri =404;
    }
    
    # Deny access to dotfiles and sensitive directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive paths
    location ~ ^/(config|runtime|tests|vendor|commands|components|models|controllers|migrations)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~ \.(env|gitignore|gitmodules|md|lock|json|yml|yaml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # PHP-FPM processing
    location ~ \.php$ {
        # Security: Don't allow PHP execution in uploads or assets
        location ~ ^/(assets|uploads)/.*\.php$ {
            deny all;
        }
        
        try_files $uri =404;
        
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Pass CSP nonce to PHP application
        fastcgi_param HTTP_X_CSP_NONCE $csp_nonce;
        
        # Increase timeouts for long-running operations
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Pass environment variables
        fastcgi_param DB_HOST $http_x_db_host;
        fastcgi_param DB_NAME $http_x_db_name;
        fastcgi_param DB_USER $http_x_db_user;
        fastcgi_param DB_PASSWORD $http_x_db_password;
    }
    
    # Yii2 URL rewriting - try files first, then route to index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Specific handling for API endpoints
    location /api/ {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Specific handling for admin panel
    location /admin/ {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Deny access to Yii2 debug and gii in production
    location ~ ^/(debug|gii) {
        deny all;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
