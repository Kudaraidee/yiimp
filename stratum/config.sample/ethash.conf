[STRATUM]
algo = ethash
; Ethash difficulty uses the standard 2^32 scale: target = 2^224 / difficulty,
; so the raw target difficulty is difficulty * 2^32 (e.g. 0.1 -> 429.5M).
; Rigel shows this as "429.50M (0.10)". 0.1 suits small GPUs (~1 share/min);
; use a larger value for faster rigs to avoid flooding the pool with shares.
difficulty = 0.1
max_ttf = 50000
; A miner can override the starting difficulty in its password with d=X
; (fixed for the session) or sd=X (seed only; vardiff may still adjust it),
; e.g. -p c=LRS,mc=LRS,sd=0.1. d= wins when both tokens are present.
; Set to 0 when several ethash coins share this port, and have miners use
; mc=SYMBOL, so a miner never receives a job with a different seed/DAG epoch.
;autoexchange = 0

; Optional Ethash chain parameters. Defaults below are for classic Ethash
; (30000 blocks per epoch). Override for chains with different epoch timing.
;[ETHASH]
;epoch_length = 30000
;seed_epoch_length = 30000
;etchash_fork_block = 0
;etchash_fork_epoch = 0
;epoch_offset = 0
;chain_id = 0
;dag_init_size = 1073741824

; The pool must run a PoW-capable Ethereum node (core-geth / Besu / ERIGON in
; Ethash mode) with eth_getWork and eth_submitWork enabled and the pool's
; beneficiary address configured on the node.
