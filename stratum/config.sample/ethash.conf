[STRATUM]
algo = ethash
; Ethash difficulty is 2^256 / target. Difficulty 1 is valid but yields the
; maximum target (0xffff...ff), which makes almost every nonce a share and can
; show as diff 0.00 in T-Rex. Use a higher value in production so miners get a
; finite target and the pool is not flooded with low-value shares.
difficulty = 16
max_ttf = 50000
; Set to 0 when several ethash coins share this port, and have miners use
; mc=SYMBOL, so a miner never receives a job with a different seed/DAG epoch.
;autoexchange = 0

; Optional Ethash chain parameters. Defaults below are for classic Ethash
; (30000 blocks per epoch). Override for chains with different epoch timing.
;[ETHASH]
;epoch_length = 30000
;seed_epoch_length = 30000
;etchash_fork_block = 0
;etchash_fork_epoch = 0
;epoch_offset = 0
;chain_id = 0
;dag_init_size = 1073741824

; The pool must run a PoW-capable Ethereum node (core-geth / Besu / ERIGON in
; Ethash mode) with eth_getWork and eth_submitWork enabled and the pool's
; beneficiary address configured on the node.
