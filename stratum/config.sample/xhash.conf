[STRATUM]
algo = xhash
; Parallax uses the same 2^32 share scale as ethash: target = 2^224 / diff.
; 0.1 gives small GPUs roughly one share per minute at typical network diff.
difficulty = 0.1
diff_min = 0.01
diff_max = 100
eth_vardiff_window = 180
eth_vardiff_target = 1
max_ttf = 50000
; Bind every login on this port to the LAX coin row (id 15). The same EVM
; address may already be bound to another EVM chain in the accounts table;
; coinid keeps this listener on LAX without changing the global binding.
autoexchange = 0
coinid = 15

; The node must expose xhash_getWork / xhash_submitWork and the usual eth_*
; block queries, with the pool payout address configured as beneficiary.
; Coin RPC host/port/credentials come from the coins row (GETH encoding).
; Parallax coinbase maturity is 100 blocks; configure payouts accordingly.
