; Meraki (Telestai / TLS) is a ProgPoW 0.9.4 variant with a 27500-block
; epoch, period 3, a 1 GiB initial DAG and Telestai's Progpow mix input. The header
; is the standard 80-byte Bitcoin header followed by nHeight (4),
; nNonce64 (8) and mix_hash (32). Telestai also requires a fixed 117 TLS
; development output in every coinbase; stratum pays it and credits the
; remaining 351 TLS to the pool.
; Add the coin with algo='meraki' and a Telestai Core 3.0.0 node at 127.0.0.1:8766.
