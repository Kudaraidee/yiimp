[STRATUM]
algo = homescrypt
; Dedicated single-coin port: bind wallet logins to LMT so they always get a
; job, even though the coin has auto_exchange=0. A miner can opt into quote
; payouts with c=USDT; quote_symbol names that accepted payout token.
autoexchange = 0
quote_symbol = USDT
; LMT network difficulty is ~0.000332720426. Use it as the starting share
; difficulty, but let vardiff move across a wide range: the low-difficulty
; vardiff keeps full precision instead of rounding sub-0.002 values to zero.
; It uses eth_vardiff_window / eth_vardiff_target (defaults 180s / 1 share/min).
difficulty = 0.000332720426
diff_min = 0.000001
diff_max = 0.01
max_ttf = 50000

; HomeScrypt v1.2 (Lumenite / LMT). The official GPU miner uses a custom
; mining.notify carrying a complete 80-byte header; the pool verifies the
; HomeScrypt digest itself. Add the coin through admin with algo='homescrypt'
; and a Lumenite Core v1.2.0 node.
