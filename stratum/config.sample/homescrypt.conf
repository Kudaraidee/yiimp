[STRATUM]
algo = homescrypt
; Dedicated single-coin port: bind wallet logins to LMT so they always get a
; job, even though the coin has auto_exchange=0.
autoexchange = 0
; LMT network difficulty is ~0.000332720426. Pin the share difficulty there:
; yiimp's Bitcoin-style vardiff rounds sub-0.002 values to zero, so the bounds
; must match the target to avoid runaway difficulty changes.
difficulty = 0.000332720426
diff_min = 0.000332720426
diff_max = 0.000332720426
max_ttf = 50000

; HomeScrypt v1.2 (Lumenite / LMT). The official GPU miner uses a custom
; mining.notify carrying a complete 80-byte header; the pool verifies the
; HomeScrypt digest itself. Add the coin through admin with algo='homescrypt'
; and a Lumenite Core v1.2.0 node.
