[STRATUM]
algo = randomscash
difficulty = 1
; Scash uses standard Stratum v1 work, so the generic Bitcoin-style vardiff
; applies. Keep the clamp wide enough for CPU miners to settle.
diff_min = 0.1
diff_max = 8192
max_ttf = 50000
;autoexchange = 0

